[project]
name = "pi-agent-events"
version = "0.1.0"
description = "Typed Pydantic v2 models for pi's `--mode rpc` AgentSessionEvent stdout stream, generated from a pinned pi version."
readme = "README.md"
authors = [
    { name = "josh-gree", email = "joshuadouglasgreenhalgh@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "pydantic>=2.13.4",
]

[build-system]
requires = ["uv_build>=0.10.9,<0.11.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "datamodel-code-generator>=0.60.0",
    "pytest>=9.0.3",
]
